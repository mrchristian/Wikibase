version: '3'
services:
  wikibase:
    image: wikibase/wikibase:mw1.45.0
    # Don't require health check for startup
    depends_on:
      mariadb: {}  # Just wait for service to exist, not require it to be healthy

  wdqs:
    depends_on:
      wikibase: {}  # Don't require healthy status

  wdqs-updater:
    depends_on:
      wdqs: {}

  wdqs-frontend:
    depends_on:
      wdqs: {}

  wikibase-sitelinks-init:
    depends_on:
      wikibase: {}



