# Auto-loaded for local development (docker compose up)
# Skipped in production when using: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  opensearch:
    ports:
      - "9200:9200"
      - "9600:9600"

  wikibase:
    ports:
      - "8080:80"

  wdqs:
    ports:
      # Loopback only: Blazegraph on :9999 is writable (SPARQL Update, workbench)
      - "127.0.0.1:9999:9999"

  wdqs-frontend:
    ports:
      - "8081:80"
    environment:
      WDQS_PUBLIC_URL: "http://localhost:8081/proxy/sparql"
      WIKIBASE_PUBLIC_URL: "http://localhost:8080/w/api.php"
